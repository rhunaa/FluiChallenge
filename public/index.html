<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Flui</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Fundo do modo escuro (padrão do Flui) desde a primeira pintura, antes do JavaScript carregar. Depois, o App.tsx aplica a cor do tema no html. -->
    <style id="flui-fundo-inicial">
      html {
        background-color: #121116;
      }
    </style>
  </head>

  <body>
    <noscript>
      Ative o JavaScript para usar o Flui.
    </noscript>
    <div id="root"></div>
  </body>
</html>
